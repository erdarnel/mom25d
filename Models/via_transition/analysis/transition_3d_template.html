<title>Via Transition 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Serif&display=swap">
<style>
/* Layout: instrument-panel header, then a control column beside one large 3D viewport; stacks on phones. */
:root {
  --bg: #f3f4f1;
  --panel: #ffffff;
  --fg: #1d2420;
  --muted: #5f6a64;
  --line: #d6dbd5;
  --accent: #b5651d;      /* copper */
  --dielectric: #6f8f7a;  /* laminate green */
  --plotbg: #fbfbf9;
  --font-display: "Instrument Serif", Georgia, serif;
  --font-body: "IBM Plex Sans", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121614; --panel: #1a201d; --fg: #e6ebe7; --muted: #9aa69f; --line: #2c3530;
    --accent: #e0914a; --dielectric: #7fa58c; --plotbg: #151a17; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121614; --panel: #1a201d; --fg: #e6ebe7; --muted: #9aa69f; --line: #2c3530;
  --accent: #e0914a; --dielectric: #7fa58c; --plotbg: #151a17; color-scheme: dark;
}
html, body { height: auto; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px;
  padding-inline: 16px; padding-block: 20px 28px; line-height: 1.45;
}
.wrap { max-width: 1280px; margin-inline: auto; display: grid; gap: 16px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 24px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(26px, 3.4vw, 38px); margin: 0; text-wrap: balance; letter-spacing: .005em; }
h1 em { color: var(--accent); font-style: italic; }
.sub { color: var(--muted); margin: 2px 0 0; max-width: 70ch; }
.stack { font-family: var(--font-data); font-size: 12px; color: var(--muted); display: grid; gap: 2px; min-width: 0; }
.stack b { color: var(--fg); font-weight: 500; }
.main { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .main { grid-template-columns: 1fr; } }
.controls { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 14px; display: grid; gap: 16px; min-width: 0; }
.group { display: grid; gap: 6px; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button {
  font: 500 13px var(--font-data); padding: 6px 10px; border-radius: 4px; cursor: pointer;
  border: 1px solid var(--line); background: transparent; color: var(--fg);
}
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.seg button:focus-visible, .check input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 13px; cursor: pointer; }
.check input { accent-color: var(--accent); }
table { border-collapse: collapse; width: 100%; font-family: var(--font-data); font-size: 12px; font-variant-numeric: tabular-nums; }
td, th { padding: 3px 0; text-align: right; }
th { text-align: left; font-weight: 500; color: var(--muted); }
.viewport { background: var(--plotbg); border: 1px solid var(--line); border-radius: 6px; min-width: 0; position: relative; }
#plot { width: 100%; height: min(72vh, 720px); min-height: 380px; }
.note { font-size: 12px; color: var(--muted); max-width: 90ch; margin: 0; }
.legendbar { display: grid; gap: 4px; }
.ramp { height: 10px; border-radius: 2px; background: linear-gradient(90deg, #000004, #420a68, #932667, #dd513a, #fca50a, #fcffa4); }
.ramp-l { display: flex; justify-content: space-between; font: 11px var(--font-data); color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Top microstrip &rarr; <em>via</em> &rarr; buried line</h1>
      <p class="sub">mom25d multilayer MoM solution. Surface current |J| on both copper layers and on the via wall, for a unit wave into the selected port with the other port matched.</p>
    </div>
    <div class="stack" id="stack"></div>
  </header>

  <div class="main">
    <aside class="controls">
      <div class="group">
        <span class="label" id="lbl-f">Frequency</span>
        <div class="seg" id="freq" role="group" aria-labelledby="lbl-f"></div>
      </div>
      <div class="group">
        <span class="label" id="lbl-p">Excitation</span>
        <div class="seg" id="port" role="group" aria-labelledby="lbl-p"></div>
      </div>
      <div class="group">
        <span class="label" id="lbl-z">Vertical scale</span>
        <div class="seg" id="zex" role="group" aria-labelledby="lbl-z"></div>
      </div>
      <div class="group">
        <span class="label">Show</span>
        <label class="check"><input type="checkbox" id="show-top" checked> top layer (z = 0.508 mm)</label>
        <label class="check"><input type="checkbox" id="show-inner" checked> inner layer (z = 0.254 mm)</label>
        <label class="check"><input type="checkbox" id="show-via" checked> via wall</label>
        <label class="check"><input type="checkbox" id="show-diel" checked> dielectric and ground</label>
      </div>
      <div class="group legendbar">
        <span class="label">|J| relative to peak</span>
        <div class="ramp" aria-hidden="true"></div>
        <div class="ramp-l"><span>&minus;40 dB</span><span>&minus;20</span><span>0 dB</span></div>
      </div>
      <div class="group">
        <span class="label">At this frequency</span>
        <table id="sp"></table>
      </div>
    </aside>

    <div class="viewport"><div id="plot" role="img" aria-label="3D view of the via transition with surface current"></div></div>
  </div>

  <p class="note" id="note"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
<script id="data" type="application/json">__DATA__</script>
<script>
(function () {
  const D = JSON.parse(document.getElementById("data").textContent);
  const st = { f: 1, p: 0, zex: 5, show: { top: true, inner: true, via: true, diel: true } };
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const db = (v, ref) => Math.max(-40, 20 * Math.log10(Math.max(v, 1e-30) / ref));

  // header stack summary
  const lv = D.stack.levels, L = D.stack.layers;
  document.getElementById("stack").innerHTML =
    `<span><b>top</b> z = ${lv.top.toFixed(3)} mm &middot; W ${D.lines.top.toFixed(3)} mm</span>` +
    `<span>${L[1].t} mm &middot; &epsilon;<sub>r</sub> ${L[1].er}</span>` +
    `<span><b>inner</b> z = ${lv.inner.toFixed(3)} mm &middot; W ${D.lines.inner.toFixed(3)} mm</span>` +
    `<span>${L[0].t} mm &middot; &epsilon;<sub>r</sub> ${L[0].er}</span>` +
    `<span><b>gnd</b> z = 0 &middot; via &oslash; ${(2 * D.via.r).toFixed(2)} mm, pads &oslash; ${(2 * D.via.rpad).toFixed(2)} mm</span>`;

  function seg(id, items, key) {
    const el = document.getElementById(id);
    el.innerHTML = "";
    items.forEach(([label, val]) => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = label;
      b.setAttribute("aria-pressed", String(st[key] === val));
      b.addEventListener("click", () => { st[key] = val; seg(id, items, key); render(); });
      el.appendChild(b);
    });
  }
  seg("freq", D.frames.map((fr, i) => [fr.f_ghz + " GHz", i]), "f");
  seg("port", D.ports.map((p, i) => [`${p.name} (${p.layer})`, i]), "p");
  seg("zex", [["1:1", 1], ["×5", 5], ["×10", 10]], "zex");
  ["top", "inner", "via", "diel"].forEach(k => {
    const cb = document.getElementById("show-" + k);
    cb.addEventListener("change", () => { st.show[k] = cb.checked; render(); });
  });

  function cylinder(x0, y0, r, z0, z1, n) {
    const x = [], y = [], z = [], i = [], j = [], k = [];
    for (let a = 0; a < n; a++) {
      const t = 2 * Math.PI * a / n;
      x.push(x0 + r * Math.cos(t), x0 + r * Math.cos(t));
      y.push(y0 + r * Math.sin(t), y0 + r * Math.sin(t));
      z.push(z0, z1);
    }
    for (let a = 0; a < n; a++) {
      const b0 = 2 * a, b1 = 2 * ((a + 1) % n);
      i.push(b0, b0 + 1); j.push(b1, b1); k.push(b0 + 1, b1 + 1);
    }
    return { x, y, z, i, j, k };
  }
  function box(x0, x1, y0, y1, z0, z1) {
    const x = [x0, x1, x1, x0, x0, x1, x1, x0], y = [y0, y0, y1, y1, y0, y0, y1, y1], z = [z0, z0, z0, z0, z1, z1, z1, z1];
    const i = [0, 0, 4, 4, 0, 0, 1, 1, 2, 2, 3, 3], j = [1, 2, 5, 6, 1, 5, 2, 6, 3, 7, 0, 4], k = [2, 3, 6, 7, 5, 4, 6, 5, 7, 6, 4, 7];
    return { x, y, z, i, j, k };
  }

  const X = D.xmax, Y = 2.0, ZT = lv.top;

  function render() {
    const fr = D.frames[st.f], ex = fr.ports[st.p];
    const viaJ = ex.via[0] / (2 * Math.PI * D.via.r * 1e-3); // A/m on the wall
    let peak = viaJ;
    D.layers.forEach(l => ex.J[l.name].forEach(v => { if (v > peak) peak = v; }));
    const fg = css("--fg"), muted = css("--muted"), diel = css("--dielectric"), line = css("--line");
    const traces = [];
    const cs = "Inferno";
    D.layers.forEach(l => {
      if (!st.show[l.name]) return;
      const J = ex.J[l.name];
      traces.push({
        type: "mesh3d", name: l.name, x: l.x, y: l.y, z: l.x.map(() => l.z), i: l.i, j: l.j, k: l.k,
        intensity: J.map(v => db(v, peak)), intensitymode: "vertex", colorscale: cs, cmin: -40, cmax: 0,
        showscale: false, flatshading: false, lighting: { ambient: 0.9, diffuse: 0.2, specular: 0.05 },
        customdata: J, hovertemplate: `${l.name}<br>x %{x:.2f} y %{y:.2f} mm<br>|J| %{intensity:.1f} dB<extra></extra>`
      });
    });
    if (st.show.via) {
      const c = cylinder(D.via.x, D.via.y, D.via.r, D.via.z0, D.via.z1, 32);
      traces.push({
        type: "mesh3d", name: "via", ...c, intensity: c.x.map(() => db(viaJ, peak)), colorscale: cs,
        cmin: -40, cmax: 0, showscale: false, lighting: { ambient: 0.75, diffuse: 0.5, specular: 0.2 },
        hovertemplate: `via wall<br>I = ${(ex.via[0] * 1e3).toFixed(2)} mA<br>|J| %{intensity:.1f} dB<extra></extra>`
      });
    }
    if (st.show.diel) {
      const g = box(-X, X, -Y, Y, -0.004, 0);
      traces.push({ type: "mesh3d", name: "ground", ...g, color: muted, opacity: 0.55, hoverinfo: "skip", flatshading: true });
      [[0, lv.inner], [lv.inner, ZT]].forEach(([z0, z1], n) => {
        const b = box(-X, X, -Y, Y, z0, z1);
        traces.push({ type: "mesh3d", name: "dielectric " + (n + 1), ...b, color: diel, opacity: 0.07, hoverinfo: "skip", flatshading: true });
      });
    }
    // reference planes and port labels
    D.ports.forEach(p => {
      const z = lv[p.layer];
      traces.push({
        type: "scatter3d", mode: "lines+text", x: [p.x, p.x], y: [-Y, Y], z: [z, z],
        line: { color: fg, width: 3, dash: "dash" }, text: [p.name + " ref", ""], textposition: "top center",
        textfont: { color: fg, family: "IBM Plex Mono, monospace", size: 12 }, hoverinfo: "skip", showlegend: false
      });
    });
    const xs = 2 * X, zr = (ZT / xs) * st.zex;
    const layout = {
      margin: { l: 0, r: 0, t: 0, b: 0 }, paper_bgcolor: "rgba(0,0,0,0)", showlegend: false,
      font: { family: "IBM Plex Sans, sans-serif", color: fg },
      scene: {
        aspectmode: "manual", aspectratio: { x: 1, y: (2 * Y) / xs, z: Math.max(zr, 0.02) },
        xaxis: { title: "x [mm]", color: muted, gridcolor: line, zerolinecolor: line, backgroundcolor: "rgba(0,0,0,0)" },
        yaxis: { title: "y [mm]", color: muted, gridcolor: line, zerolinecolor: line, backgroundcolor: "rgba(0,0,0,0)" },
        zaxis: { title: st.zex === 1 ? "z [mm]" : `z [mm] (×${st.zex})`, color: muted, gridcolor: line, zerolinecolor: line, backgroundcolor: "rgba(0,0,0,0)" },
        camera: (window.__cam || { eye: { x: -0.9, y: -1.25, z: 0.75 } })
      }
    };
    const el = document.getElementById("plot");
    Plotly.react(el, traces, layout, { displaylogo: false, responsive: true });
    if (!el.__hooked) {
      el.on("plotly_relayout", e => { if (e["scene.camera"]) window.__cam = e["scene.camera"]; });
      el.__hooked = true;
    }

    // S-parameters and line data
    const mag = c => 20 * Math.log10(Math.hypot(c[0], c[1]));
    const ang = c => Math.atan2(c[1], c[0]) * 180 / Math.PI;
    const rows = ["S11", "S21", "S22"].map(k => `<tr><th>${k}</th><td>${mag(fr.S[k]).toFixed(2)} dB</td><td>${ang(fr.S[k]).toFixed(1)}&deg;</td></tr>`).join("");
    const fi = st.f;
    document.getElementById("sp").innerHTML = rows +
      `<tr><th>via I</th><td colspan="2">${(ex.via[0] * 1e3).toFixed(1)} mA per 1 A wave</td></tr>` +
      `<tr><th>&epsilon;<sub>eff</sub> P1 / P2</th><td colspan="2">${D.eeff[fi][0]} / ${D.eeff[fi][1]}</td></tr>` +
      `<tr><th>Z<sub>0</sub> P1 / P2</th><td colspan="2">${D.z0[fi][0]} / ${D.z0[fi][1]} &Omega;</td></tr>`;
  }

  document.getElementById("note").textContent =
    `Solver output, ${D.n_unknowns} unknowns (RWG edges on both layers plus one via segment). S is referenced to 50 Ω at the dashed reference planes, 3 mm either side of the via. ` +
    `Feed lines are cut ${(D.xmax - D.ref).toFixed(0)} mm past the reference planes; the delta-gap sources beyond that are not shown. ` +
    `Colours are |J| in dB relative to the largest value in the current view, shared by both layers and the via wall (via: I / circumference). ` +
    `Drag to rotate, scroll to zoom. The vertical scale is exaggerated by default because the 0.5 mm stack is thin next to an 18 mm long view.`;

  function boot() {
    if (!window.Plotly) { document.getElementById("plot").textContent = "Plotly could not load; check the network and reload."; return; }
    render();
    const mq = window.matchMedia("(prefers-color-scheme: dark)");
    mq.addEventListener && mq.addEventListener("change", render);
    new MutationObserver(render).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  }
  boot();
})();
</script>
